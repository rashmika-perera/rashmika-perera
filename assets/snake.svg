
<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" role="img" aria-label="Animated snake">
  <!-- background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <path d="M40 0H0V40" stroke="#2b2b2b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="snakeGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#9BE15D"/>
      <stop offset="100%" stop-color="#00E3A3"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#0f1724"/>
  <rect x="20" y="10" width="760" height="100" fill="url(#grid)" opacity="0.6"/>

  <!-- path the snake follows -->
  <path id="snakePath" d="
    M40 60
    h120
    a20 20 0 0 1 20 20
    v0
    h140
    a20 20 0 0 1 20 20
    v0
    h120
  " fill="none" stroke="transparent"/>

  <!-- draw some subtle nodes (optional) -->
  <g transform="translate(0,0)" opacity="0.08">
    <circle cx="40" cy="60" r="8" fill="#fff"/>
    <circle cx="160" cy="60" r="8" fill="#fff"/>
    <circle cx="320" cy="60" r="8" fill="#fff"/>
    <circle cx="480" cy="60" r="8" fill="#fff"/>
    <circle cx="640" cy="60" r="8" fill="#fff"/>
  </g>

  <!-- snake segments: several circles following the same path with staggered start times -->
  <g id="snake" fill="url(#snakeGrad)" stroke="#082018" stroke-width="1">
    <!-- head -->
    <circle r="12">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="0s">
        <mpath xlink:href="#snakePath"/>
      </animateMotion>
    </circle>

    <!-- body segments (staggered) -->
    <circle r="10" opacity="0.95">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="-0.24s">
        <mpath xlink:href="#snakePath"/>
      </animateMotion>
    </circle>

    <circle r="9" opacity="0.9">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="-0.48s">
        <mpath xlink:href="#snakePath"/>
      </animateMotion>
    </circle>

    <circle r="8" opacity="0.85">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="-0.72s">
        <mpath xlink:href="#snakePath"/>
      </animateMotion>
    </circle>

    <circle r="7" opacity="0.8">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="-0.96s">
        <mpath xlink:href="#snakePath"/>
      </animateMotion>
    </circle>

    <circle r="6" opacity="0.75">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="-1.2s">
        <mpath xlink:href="#snakePath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- small "eye" on the head using motionPath to stick to head -->
  <circle r="2.4" fill="#02160f">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="0s">
      <mpath xlink:href="#snakePath"/>
    </animateMotion>
    <animate attributeName="cx" values="0;0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- caption (optional) -->
  <text x="20" y="112" font-family="Segoe UI, Roboto, Arial" font-size="11" fill="#9aa4b2">simple snake animation — add to your README</text>
</svg>
