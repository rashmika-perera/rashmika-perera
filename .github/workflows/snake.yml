name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: rashmika-perera
          outputs: |
            dist/snake-dark.svg?color_snake=00ff99&color_grid=0d1117&color_dots=#30363d

      - name: Upload to repo
        uses: actions/upload-artifact@v3
        with:
          name: snake-dark
          path: dist/snake-dark.svg

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
