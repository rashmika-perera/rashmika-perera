name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: rashmika-perera
          outputs: |
            dist/snake-dark.svg?color_snake=9b5de5&color_grid=0d1117&color_dots=00ff66&color_back=0d1117

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-dark
          path: dist/snake-dark.svg

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
