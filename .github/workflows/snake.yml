name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch: # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout
        uses: actions/checkout@v4

      # Generate snake SVG
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: rashmika-perera
          outputs: |
            dist/snake-dark.svg? palette=github-dark&color_snake=#9b5de5&color_dots=#c6f6d5,#9ae6b4,#68d391,#48bb78,#38a169

      # Upload artifact (new version)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-dark
          path: dist/snake-dark.svg

      # Deploy to "output" branch
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
