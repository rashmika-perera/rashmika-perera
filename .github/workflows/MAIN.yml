name: Generate Snake

# Run every 6 hours and manually if needed
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - uses: actions/checkout@v2

      # 2️⃣ Generate the snake GIF and SVG
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: rashmika-perera   # ✅ Your GitHub username
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # 3️⃣ Debug: show the generated files (optional)
      - run: ls -la dist

      # 4️⃣ Deploy to output branch (no need to push manually)
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output         # ✅ Branch to hold generated files
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
